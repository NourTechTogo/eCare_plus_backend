name: Backend verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash mvnw -B verify
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ecare_test
          POSTGRES_USER: ecare_test
          POSTGRES_PASSWORD: ecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecare_test -d ecare_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply real migrations, validate mappings and run all tests
        run: >-
          bash mvnw -B verify
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/ecare_test
          -Dspring.datasource.username=ecare_test
          -Dspring.datasource.password=ecare_test
          -Dspring.flyway.enabled=true
          -Dspring.jpa.hibernate.ddl-auto=validate
