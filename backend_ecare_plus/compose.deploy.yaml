name: ecare-plus

services:
  backend:
    container_name: ecare-plus-backend
    build:
      context: .
      dockerfile: Dockerfile
    image: ecare-plus-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecare_plus}
      DB_USERNAME: ${DB_USERNAME:-ecare_plus}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD dans .env.docker}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Definir APP_JWT_SECRET dans .env.docker}
      APP_JWT_TTL: ${APP_JWT_TTL:-PT1H}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:?Definir les origines du frontend}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - '${HTTP_PORT:-8080}:8080'
    stop_grace_period: 30s

  postgres:
    container_name: ecare-plus-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecare_plus}
      POSTGRES_USER: ${DB_USERNAME:-ecare_plus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD dans .env.docker}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-deploy-data:/var/lib/postgresql/data

volumes:
  postgres-deploy-data:
    name: ecare-plus_postgres-deploy-data
