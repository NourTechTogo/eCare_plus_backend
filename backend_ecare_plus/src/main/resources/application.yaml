spring:
  servlet:
    multipart:
      max-file-size: ${APP_DOCUMENT_TAILLE_MAX:5242880}B
      max-request-size: 6291456B
  application:
    name: ecare-plus
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecare_plus}
    username: ${DB_USERNAME:ecare_plus}
    password: ${DB_PASSWORD:ecare_plus}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  notifications:
    gateway-url: ${APP_NOTIFICATION_GATEWAY_URL:}
    gateway-secret: ${APP_NOTIFICATION_GATEWAY_SECRET:}
    tentatives-max: ${APP_NOTIFICATION_TENTATIVES_MAX:5}
    delai-reprise-secondes: ${APP_NOTIFICATION_DELAI_REPRISE_SECONDES:30}
  appels:
    livekit-url: ${APP_LIVEKIT_URL:}
    api-key: ${APP_LIVEKIT_API_KEY:}
    api-secret: ${APP_LIVEKIT_API_SECRET:}
    revocation-active: ${APP_LIVEKIT_REVOCATION_ACTIVE:false}
  documents:
    repertoire: ${APP_DOCUMENT_REPERTOIRE:./var/ecare-prive}
    taille-max: ${APP_DOCUMENT_TAILLE_MAX:5242880}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  security:
    jwt:
      secret: ${APP_JWT_SECRET:}
      ttl: ${APP_JWT_TTL:PT1H}
  mail:
    from: ${MAIL_FROM:}
