services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecare_plus
      POSTGRES_PASSWORD: ecare_plus
      POSTGRES_USER: ecare_plus
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecare_plus -d ecare_plus"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
